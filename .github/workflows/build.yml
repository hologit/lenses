name: Build Packages

on:
  pull_request:
  push:
    branches:
      # publish every image as :v2 (and :v2-<shortsha>) while the v2 job
      # protocol soaks; :latest stays bound to the release trigger below
      - develop
      - feat/protocol-v2
  release:
    types: [created]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version-patch: ${{ steps.set-version.outputs.patch }}
      version-minor: ${{ steps.set-version.outputs.minor }}
      version-major: ${{ steps.set-version.outputs.major }}
      shortsha: ${{ steps.set-shortsha.outputs.shortsha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: set-shortsha
        run: echo "shortsha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Get release version
        id: set-version
        if: github.event_name == 'release'
        run: |
          # Strip the 'v' prefix from the tag
          PATCH_VERSION="${GITHUB_REF#refs/tags/v}"
          MINOR_VERSION="${PATCH_VERSION%.*}"
          MAJOR_VERSION="${MINOR_VERSION%.*}"

          echo "patch=${PATCH_VERSION}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR_VERSION}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR_VERSION}" >> $GITHUB_OUTPUT

      - name: Set PR versions
        id: set-pr-version
        if: github.event_name == 'pull_request'
        run: |
          echo "patch=0.0.0" >> $GITHUB_OUTPUT
          echo "minor=0.0" >> $GITHUB_OUTPUT
          echo "major=0" >> $GITHUB_OUTPUT

      - name: Discover container images for build matrix
        id: set-matrix
        run: |
          DIRS=$(find . -name Dockerfile -exec dirname {} \; | sed 's|^./||' | grep -v '^_base-image$' | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=${DIRS}" >> $GITHUB_OUTPUT

  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: _base-image/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # branch pushes publish the base under a :node-20-v2 tag so lens
          # builds can substitute it without touching the released :node-20
          tags: ${{ github.event_name == 'push' && 'ghcr.io/hologit/lenses/base:node-20-v2' || 'ghcr.io/hologit/lenses/base:node-20' }}
          cache-from: |
            type=registry,ref=ghcr.io/hologit/lenses/base:node-20
            type=registry,ref=ghcr.io/hologit/lenses/base:node-20-v2
          cache-to: type=inline

  publish-npm:
    needs: [discover]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package: [lens-lib, lens-lib-k8s]
    defaults:
      run:
        working-directory: _${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Setting package.json version
        if: github.event_name == 'release'
        run: npm version --no-git-tag-version "${{ needs.discover.outputs.version-patch }}"

      - run: npm install

      - run: npm publish --provenance --access public
        if: github.event_name == 'release'

  build-lens:
    needs: [discover, build-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ github.event_name == 'release' && format('ghcr.io/hologit/lenses/{0}:latest,ghcr.io/hologit/lenses/{0}:{1},ghcr.io/hologit/lenses/{0}:{2},ghcr.io/hologit/lenses/{0}:{3}', matrix.image, needs.discover.outputs.version-major, needs.discover.outputs.version-minor, needs.discover.outputs.version-patch) || '' }}
            ${{ github.event_name == 'push' && format('ghcr.io/hologit/lenses/{0}:v2,ghcr.io/hologit/lenses/{0}:v2-{1}', matrix.image, needs.discover.outputs.shortsha) || '' }}
          # branch pushes build against the :node-20-v2 base published by
          # build-base; FROM lines still name :node-20, so substitute it via a
          # named build context (releases keep building against :node-20)
          build-contexts: ${{ github.event_name == 'push' && 'ghcr.io/hologit/lenses/base:node-20=docker-image://ghcr.io/hologit/lenses/base:node-20-v2' || '' }}
          cache-from: |
            type=registry,ref=ghcr.io/hologit/lenses/${{ matrix.image }}:latest
            type=registry,ref=ghcr.io/hologit/lenses/${{ matrix.image }}:v2
          cache-to: type=inline
